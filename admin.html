<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Photo dashboard — External Excellencies Global Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --forest:#16302A; --forest-deep:#0D211B; --ivory:#FAF8F3; --gold:#C9A768; --sand:#7A6650; --clay:#B5502F; }
  body { margin:0; font-family:"Inter",-apple-system,BlinkMacSystemFont,sans-serif; background:var(--ivory); color:#201F1B; }
  .rule { height:2px; width:32px; background:var(--gold); margin-bottom:20px; }

  #gate { max-width:400px; margin:0 auto; padding:80px 24px; }
  #gate h1 { font-family:"Source Serif 4",Georgia,serif; font-size:1.6rem; color:var(--forest-deep); margin:0 0 6px; }
  #gate p { color:var(--sand); font-size:0.92rem; line-height:1.6; margin:0 0 22px; }
  #gate input {
    width:100%; box-sizing:border-box; padding:13px 14px; font-size:1rem;
    border:1px solid #d9d2c2; border-radius:4px; margin-bottom:12px; font-family:inherit;
  }
  #gate input:focus { outline:2px solid var(--gold); outline-offset:1px; }
  #gate button {
    width:100%; padding:13px 14px; font-size:0.95rem; font-weight:600;
    background:var(--forest); color:var(--ivory); border:none; border-radius:4px; cursor:pointer;
  }
  #gate button:hover { background:var(--forest-deep); }
  #gate .err { color:var(--clay); font-size:0.88rem; margin-top:10px; display:none; }
  #gate .note { margin-top:28px; font-size:0.8rem; color:#9a8f79; line-height:1.6; }

  #boot { max-width:620px; margin:0 auto; padding:64px 24px; display:none; }
  #boot h1 { font-family:"Source Serif 4",Georgia,serif; font-size:1.7rem; color:var(--forest-deep); margin:0 0 6px; }
  #boot .sub { color:var(--sand); font-size:0.95rem; margin:0 0 28px; }
  #boot ol { padding-left:20px; line-height:1.7; font-size:0.95rem; }
  #boot li { margin-bottom:8px; }
  #boot code { background:#EFEADF; padding:2px 6px; border-radius:3px; font-size:0.85em; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid #d9d2c2; border-top-color:var(--forest); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-2px; margin-right:8px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation:none; } }

  #gate input[type=email] { display:block; }
  #app { display:none; }
  .bar { display:flex; align-items:center; gap:14px; padding:14px 24px; background:var(--forest-deep); color:var(--ivory); }
  .bar strong { font-family:"Source Serif 4",Georgia,serif; font-size:1.1rem; flex:1; }
  .bar span { font-size:0.85rem; opacity:.8; }
  .bar button { background:transparent; color:var(--ivory); border:1px solid rgba(255,255,255,.4); border-radius:4px; padding:6px 12px; cursor:pointer; font:inherit; font-size:0.85rem; }
  #tabs { display:flex; gap:6px; flex-wrap:wrap; padding:14px 24px 0; border-bottom:1px solid #e3dccb; }
  #tabs button { background:none; border:none; border-bottom:3px solid transparent; padding:10px 14px; font:inherit; font-weight:600; color:var(--sand); cursor:pointer; }
  #tabs button.on { color:var(--forest-deep); border-bottom-color:var(--gold); }
  #panel { max-width:760px; margin:0 auto; padding:28px 24px 80px; }
  #panel h2 { font-family:"Source Serif 4",Georgia,serif; color:var(--forest-deep); margin:0 0 6px; }
  #panel h3 { margin:26px 0 6px; color:var(--forest-deep); font-size:1.05rem; }
  .desc, .hint { color:var(--sand); font-size:0.88rem; line-height:1.55; margin:0 0 14px; }
  .hint { font-size:0.8rem; margin:4px 0 0; }
  .field { margin-bottom:16px; }
  .field > label { display:block; font-weight:600; font-size:0.9rem; margin-bottom:6px; }
  .field input[type=text], .field select { width:100%; box-sizing:border-box; padding:10px 12px; font:inherit; border:1px solid #d9d2c2; border-radius:4px; background:#fff; }
  .field.check label { display:flex; gap:10px; align-items:flex-start; font-weight:600; font-size:0.9rem; }
  .item { border:1px solid #e3dccb; background:#fff; border-radius:6px; padding:16px; margin-bottom:14px; }
  .item-head { display:flex; gap:6px; align-items:center; margin-bottom:12px; }
  .item-title { flex:1; font-weight:600; color:var(--forest); }
  .item .item { background:#FAF8F3; }
  fieldset.obj { border:1px solid #e3dccb; border-radius:6px; padding:14px 16px 4px; margin:0 0 16px; }
  fieldset.obj legend { font-weight:600; padding:0 6px; }
  .btn { background:#fff; border:1px solid #d9d2c2; border-radius:4px; padding:7px 12px; font:inherit; font-size:0.85rem; cursor:pointer; }
  .btn.danger { color:var(--clay); }
  .btn.primary { background:var(--forest); color:var(--ivory); border-color:var(--forest); font-weight:600; padding:12px 22px; font-size:0.95rem; }
  .btn:disabled { opacity:.6; cursor:wait; }
  .thumb { display:block; max-width:180px; max-height:120px; border-radius:4px; margin-bottom:8px; }
  .status { font-size:0.82rem; color:var(--sand); margin-left:8px; }
  .publish-row { margin-top:28px; padding-top:20px; border-top:1px solid #e3dccb; }
</style>
</head>
<body>

<!-- ============================================================
     admin.html — photo dashboard, powered by Supabase
     ------------------------------------------------------------
     Sign in with the admin user you created in Supabase
     (Authentication → Users). Changes are saved to the
     `site_content` table and photos go to the `gallery` storage
     bucket. Keys live in supabase-config.js. Setup steps are in
     DASHBOARD-SETUP.md.
     ============================================================ -->

<div id="gate">
  <div class="rule"></div>
  <h1>Photo dashboard</h1>
  <p>Sign in with your admin account.</p>
  <input type="email" id="login-email" placeholder="Email" autocomplete="username" />
  <input type="password" id="login-pass" placeholder="Password" autocomplete="current-password" />
  <button id="login-btn">Sign in</button>
  <p class="err" id="login-err"></p>
</div>

<div id="app">
  <div class="bar"><strong>Photo dashboard</strong><span id="who"></span><button id="logout">Sign out</button></div>
  <div id="tabs"></div>
  <div id="panel"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  var sb = null;
  var CONTENT = {};   // key -> data, e.g. CONTENT.gallery = { slides: [...] }

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function showLoginError(msg) { var e = $('login-err'); e.textContent = msg; e.style.display = 'block'; }

  /* ---------- sign in ---------- */

  var connected = window.SUPABASE_URL && window.SUPABASE_URL.indexOf('YOUR-') === -1 &&
                  window.SUPABASE_ANON_KEY && window.SUPABASE_ANON_KEY.indexOf('YOUR-') === -1;

  if (!connected || !window.supabase) {
    showLoginError('Not connected yet. Open supabase-config.js and paste your Supabase project URL and anon key.');
    $('login-btn').disabled = true;
  } else {
    sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    sb.auth.getSession().then(function (r) { if (r.data.session) start(r.data.session); });
  }

  async function doLogin() {
    if (!sb) return;
    $('login-err').style.display = 'none';
    var r = await sb.auth.signInWithPassword({ email: $('login-email').value.trim(), password: $('login-pass').value });
    if (r.error) return showLoginError(r.error.message);
    start(r.data.session);
  }
  $('login-btn').addEventListener('click', doLogin);
  $('login-pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  $('logout').addEventListener('click', async function () { await sb.auth.signOut(); location.reload(); });

  async function start(session) {
    $('gate').style.display = 'none';
    $('app').style.display = 'block';
    $('who').textContent = session.user.email;
    var r = await sb.from('site_content').select('key,data');
    if (r.error) alert('Could not load content: ' + r.error.message + '\n\nHave you run supabase-setup.sql yet?');
    CONTENT = {};
    (r.data || []).forEach(function (row) { CONTENT[row.key] = row.data || {}; });
    buildTabs();
    showTab(0);
  }

  /* ---------- tabs = the collections in DASHBOARD_CONFIG ---------- */

  function keyOf(col) { return col.files[0].file.replace(/^content\//, '').replace(/\.json$/, ''); }

  function buildTabs() {
    var tabs = $('tabs');
    tabs.innerHTML = '';
    DASHBOARD_CONFIG.collections.forEach(function (col, i) {
      var b = el('button', null, col.label);
      b.addEventListener('click', function () { showTab(i); });
      tabs.appendChild(b);
    });
  }

  function showTab(i) {
    Array.prototype.forEach.call($('tabs').children, function (b, n) { b.className = n === i ? 'on' : ''; });
    var col = DASHBOARD_CONFIG.collections[i];
    var key = keyOf(col);
    if (!CONTENT[key]) CONTENT[key] = {};

    var panel = $('panel');
    panel.innerHTML = '';
    panel.appendChild(el('h2', null, col.label));
    panel.appendChild(el('p', 'desc', col.description || ''));
    renderFields(col.files[0].fields, CONTENT[key], panel);

    var row = el('div', 'publish-row');
    var btn = el('button', 'btn primary', 'Publish');
    var status = el('span', 'status');
    btn.addEventListener('click', async function () {
      btn.disabled = true;
      status.textContent = 'Publishing…';
      var r = await sb.from('site_content').upsert({ key: key, data: CONTENT[key], updated_at: new Date().toISOString() });
      btn.disabled = false;
      status.textContent = r.error ? 'Failed: ' + r.error.message : 'Published ✓ — live on the site now.';
    });
    row.appendChild(btn);
    row.appendChild(status);
    panel.appendChild(row);
  }

  /* ---------- tiny form builder (string, boolean, select, image, object, list) ---------- */

  function renderFields(fields, data, parent) {
    fields.forEach(function (f) { parent.appendChild(renderField(f, data)); });
  }

  function renderField(f, data) {
    if (f.widget === 'list') return renderList(f, data);

    if (f.widget === 'object') {
      var box = el('fieldset', 'obj');
      box.appendChild(el('legend', null, f.label));
      data[f.name] = data[f.name] || {};
      renderFields(f.fields, data[f.name], box);
      return box;
    }

    var wrap = el('div', 'field');

    if (f.widget === 'boolean') {
      if (data[f.name] === undefined) data[f.name] = !!f.default;
      wrap.className = 'field check';
      var lab = el('label');
      var cb = el('input'); cb.type = 'checkbox'; cb.checked = !!data[f.name];
      cb.addEventListener('change', function () { data[f.name] = cb.checked; });
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(f.label));
      wrap.appendChild(lab);
    } else {
      wrap.appendChild(el('label', null, f.label));

      if (f.widget === 'select') {
        if (data[f.name] === undefined) data[f.name] = f.default !== undefined ? f.default : f.options[0].value;
        var sel = el('select');
        f.options.forEach(function (o) {
          var opt = el('option', null, o.label); opt.value = o.value; sel.appendChild(opt);
        });
        if (!f.options.some(function (o) { return o.value === data[f.name]; })) {
          var extra = el('option', null, data[f.name]); extra.value = data[f.name]; sel.appendChild(extra);
        }
        sel.value = data[f.name];
        sel.addEventListener('change', function () { data[f.name] = sel.value; });
        wrap.appendChild(sel);

      } else if (f.widget === 'image') {
        var img = el('img', 'thumb');
        if (data[f.name]) img.src = data[f.name]; else img.style.display = 'none';
        var file = el('input'); file.type = 'file'; file.accept = 'image/*';
        var st = el('span', 'status');
        file.addEventListener('change', async function () {
          var picked = file.files[0];
          if (!picked) return;
          st.textContent = 'Uploading…';
          try {
            var url = await uploadImage(picked);
            data[f.name] = url;
            img.src = url; img.style.display = 'block';
            st.textContent = 'Uploaded ✓ — click Publish to save.';
          } catch (e) { st.textContent = 'Upload failed: ' + e.message; }
        });
        wrap.appendChild(img);
        wrap.appendChild(file);
        wrap.appendChild(st);

      } else {   // string
        var inp = el('input'); inp.type = 'text'; inp.value = data[f.name] || '';
        inp.addEventListener('input', function () { data[f.name] = inp.value; });
        wrap.appendChild(inp);
      }
    }

    if (f.hint) wrap.appendChild(el('p', 'hint', f.hint));
    return wrap;
  }

  function renderList(f, data) {
    data[f.name] = data[f.name] || [];
    var items = data[f.name];
    var box = el('div');
    box.appendChild(el('h3', null, f.label));
    if (f.hint) box.appendChild(el('p', 'hint', f.hint));
    var holder = el('div');
    box.appendChild(holder);

    function draw() {
      holder.innerHTML = '';
      items.forEach(function (item, i) {
        var card = el('div', 'item');
        var head = el('div', 'item-head');
        head.appendChild(el('span', 'item-title', (f.label_singular || 'Item') + ' ' + (i + 1)));
        function small(label, cls, fn) {
          var b = el('button', 'btn' + (cls ? ' ' + cls : ''), label);
          b.addEventListener('click', fn);
          head.appendChild(b);
        }
        small('↑', '', function () { if (i > 0) { var t = items[i - 1]; items[i - 1] = items[i]; items[i] = t; draw(); } });
        small('↓', '', function () { if (i < items.length - 1) { var t = items[i + 1]; items[i + 1] = items[i]; items[i] = t; draw(); } });
        small('Remove', 'danger', function () { items.splice(i, 1); draw(); });
        card.appendChild(head);
        renderFields(f.fields, item, card);
        holder.appendChild(card);
      });
    }

    var add = el('button', 'btn', '+ Add ' + (f.label_singular || 'item').toLowerCase());
    add.addEventListener('click', function () { items.push({}); draw(); });
    box.appendChild(add);
    draw();
    return box;
  }

  async function uploadImage(file) {
    var bucket = window.SUPABASE_BUCKET || 'gallery';
    var name = Date.now() + '-' + file.name.toLowerCase().replace(/[^a-z0-9.]+/g, '-');
    var r = await sb.storage.from(bucket).upload(name, file, { cacheControl: '31536000', upsert: false, contentType: file.type });
    if (r.error) throw r.error;
    return sb.storage.from(bucket).getPublicUrl(name).data.publicUrl;
  }
